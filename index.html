
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Page Title -->
    <title>ROVARD | Premium Men's Streetwear & Clothing</title>

    <!-- SEO: Meta Description -->
    <meta
      name="description"
      content="Shop ROVARD for premium men's streetwear, oversized T-shirts, hoodies, sweatshirts, jackets, and modern everyday essentials."
    />

    <!-- SEO: Search Engine Instructions -->
    <meta name="robots" content="index, follow" />

    <!-- Website Identity -->
    <meta name="application-name" content="ROVARD" />
    <meta name="theme-color" content="#050403" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Canonical URL: Replace with your actual domain -->
    <!-- <link rel="canonical" href="https://yourdomain.com/" /> -->

    <!-- Open Graph: Facebook, WhatsApp, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ROVARD" />
    <meta
      property="og:title"
      content="ROVARD | Premium Men's Streetwear & Clothing"
    />
    <meta
      property="og:description"
      content="Discover premium hoodies, oversized tees, jackets, and modern streetwear essentials at ROVARD."
    />
    <!-- <meta property="og:url" content="https://yourdomain.com/" /> -->
    <!-- <meta
      property="og:image"
      content="https://yourdomain.com/images/og-image.jpg"
    /> -->

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ROVARD | Premium Men's Streetwear & Clothing"
    />
    <meta
      name="twitter:description"
      content="Discover premium streetwear, hoodies, oversized tees, and jackets at ROVARD."
    />
    <!-- <meta
      name="twitter:image"
      content="https://yourdomain.com/images/og-image.jpg"
    /> -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
